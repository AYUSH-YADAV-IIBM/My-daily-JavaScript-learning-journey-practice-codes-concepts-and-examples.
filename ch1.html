    <script>
        //syntax
        let age=25;
        age=age+1;
        console.log(age);
        //calculate cgpa
        let cgpa;
        cgpa=10;
        console.log(cgpa);
        //sum number
        let a=10;
       let b=20;
       let sum=a+b;
       console.log(sum);
       //use const keyword not change any value
       //constant jisko assine ho gya uska value change nahi ho ga
       const year=2026;
       //year=year+1 does not work
       console.log(year)
       //without const
       let year1=2026
       year1=year1+2
       console.log(year1);
       //var keyword:old syntax of writing variable
       var agea=20;
       console.log(agea)
       //
       var num1=25;
       var num2=25;
       var sum1=num1+num2;
      console.log(sum1);
      
    </script>
