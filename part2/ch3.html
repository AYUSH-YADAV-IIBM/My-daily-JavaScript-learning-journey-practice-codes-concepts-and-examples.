        //nested if else
        //can have many levels
       
let marks = 33;

if (marks >= 32) {
    console.log("Pass");

    if (marks >= 80) {
        console.log("Grade: O");
    }
    else if (marks >= 60) {
        console.log("Grade: A");
    }
    else {
        console.log("Grade: B");
    }

} else {
    console.log("Better luck next time");
}
