    <script>

      //create a system to calculate popcorn price based on the size
      //  costomer asked for user if size is l=200 m=100 s=50\
let size = prompt("Which popcorn do you want (L,M,S)?");
      let price=0;

      if(size==="L"  || size==="l"){
        price=200;
      }
      else if(size==="M" || size==="m"){
        price=100;
      }
      else if(size==="S" || size==="s"){
        price=50;
      }else{
        console.log("inviled size selected")
      }
      if(price>0){
        console.log("your popcorn price is",price)
      }


      
      


    

    </script>
