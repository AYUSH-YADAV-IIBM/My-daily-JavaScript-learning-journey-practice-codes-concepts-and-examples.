
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background: #f2f2f2;
        }

        .game {
            background: white;
            padding: 30px;
            width: 300px;
            margin: auto;
            border-radius: 12px;
        }

        input, button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="game">
        <h2>Number Guessing Game 🎮</h2>

        <p>Guess a number between 1 and 100</p>

        <input type="number" id="guess" placeholder="Enter your guess">

        <br>

        <button onclick="checkGuess()">Submit</button>

        <p id="message"></p>
        <p id="attempts">Attempts: 0/5</p>
    </div>

    <script>

        const random = Math.floor(Math.random() * 100) + 1;

        let attempts = 0;
        const maxAttempts = 5;

        function checkGuess() {

            let guess = Number(document.getElementById("guess").value);

            let message = document.getElementById("message");
            let attemptText = document.getElementById("attempts");

            if (guess < 1 || guess > 100 || !Number.isInteger(guess)) {
                message.innerText = "Enter a number between 1 and 100!";
                return;
            }

            if (attempts >= maxAttempts) {
                message.innerText = "Game Over! Refresh to play again.";
                return;
            }

            attempts++;

            if (guess === random) {
                message.innerText = "Congratulations! Correct Number 🎉";
            }
            else if (guess < random) {
                message.innerText = "Too Small! Try a larger number.";
            }
            else {
                message.innerText = "Too Large! Try a smaller number.";
            }

            attemptText.innerText = "Attempts: " + attempts + "/5";

            if (guess === random) {
                message.innerText += " You won!";
                document.getElementById("guess").disabled = true;
            }
            else if (attempts === maxAttempts) {
                message.innerText = "Game Over! Number was " + random;
                document.getElementById("guess").disabled = true;
            }

        }

    </script>

</body>
</html>
