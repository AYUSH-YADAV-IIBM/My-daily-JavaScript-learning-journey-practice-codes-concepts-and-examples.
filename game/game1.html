    <script>
//usr entr max no than tries to guess the gen no 1tomax
const max=prompt("enter the max number:");
const random= Math.floor(Math.random() * max) +1;

let guess= prompt("guess the number:");

while(true){
    if(guess=="quit"){
        console.log("user quit")
        break;
    }
    if(guess==random){
        console.log("you are guess right number!!",random);
        break
    }else if(guess<random){
        guess=prompt("your number is small please entr largest no");
    }else{
        guess=prompt("your number is large please enter small no");
    }
}


      
      


    

    </script>
